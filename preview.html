<html lang="ar" dir="rtl">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الأذكار المختارة - رفيق الذكر</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .font-quran {
      font-family: 'Amiri', serif;
    }
    .tap-effect:active {
      transform: scale(0.96);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #10B981;
      border-radius: 4px;
    }

<body class="bg-slate-950 flex items-center justify-center min-h-screen p-2 sm:p-4 text-slate-100">

  <!-- Mobile Frame Mockup -->

    <!-- Android Status Bar -->
    <div class="h-8 bg-slate-900/90 flex items-center justify-between px-6 text-xs text-slate-400 select-none z-20">
      <span id="current-time">12:30</span>
      <div class="flex items-center gap-2">
        <i data-lucide="wifi" class="w-3.5 h-3.5"></i>
        <i data-lucide="battery-charging" class="w-4 h-4"></i>
      </div>
    </div>

    <!-- App Header -->

      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-emerald-700/40 flex items-center justify-center border border-emerald-500/30 text-emerald-300">

        </div>
        <div>
          <h1 id="app-title" class="text-base font-bold text-emerald-100 leading-tight">الأذكار المختارة</h1>
          <p id="app-subtitle" class="text-[11px] text-emerald-400">زد أذكارك وطهّر لسانك بذكر الله</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <!-- Language Selector Dropdown -->
        <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-emerald-800/60 border border-emerald-600/40 text-emerald-100 text-xs rounded-lg px-2 py-1.5 focus:outline-none cursor-pointer font-semibold">
          <option value="ar">العربية</option>
          <option value="en">English</option>
          <option value="fr">Français</option>
        </select>

        <button onclick="openModal()" class="flex items-center gap-1.5 px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white rounded-lg text-xs font-semibold shadow-sm transition">
          <i data-lucide="plus-circle" class="w-4 h-4"></i>
          <span id="add-btn-text">زد ذكراً</span>
        </button>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col p-4 overflow-y-auto custom-scrollbar gap-4">
      
      <!-- Big Active Dhikr Counter Card -->
      <div class="relative bg-gradient-to-b from-slate-800/90 to-slate-800/50 border border-emerald-500/20 rounded-2xl p-5 shadow-lg flex flex-col items-center justify-between">
        
        <div class="w-full flex justify-between items-center text-xs text-emerald-400/80 mb-2">
          <span class="bg-emerald-950/70 border border-emerald-700/40 px-2.5 py-1 rounded-md text-[11px]" id="current-category">الذكر الحالي</span>
          <span class="flex items-center gap-1">
            <span id="target-label-text">الهدف:</span>
            <span id="target-count" class="font-bold text-emerald-300">100</span>
          </span>
        </div>

        <!-- Dhikr Text -->
        <div class="min-h-[70px] flex items-center justify-center text-center my-2 px-2">
          <p id="current-dhikr-text" class="text-lg md:text-xl font-bold font-quran text-emerald-50 leading-relaxed drop-shadow">
            سُبْحَانَ اللَّهِ وَبِحَمْدِهِ ، سُبْحَانَ اللَّهِ الْعَظِيمِ
          </p>
        </div>

        <p id="current-dhikr-virtue" class="text-xs text-slate-400 text-center mb-4 italic line-clamp-1">
          حبيبتان إلى الرحمن، خفيفتان على اللسان، ثقيلتان في الميزان
        </p>

        <!-- Circular Big Tap Button -->
        <div class="relative my-2">
          <!-- Outer Ring / Progress indicator -->
          <svg class="w-44 h-44 -rotate-90">
            <circle cx="88" cy="88" r="74" stroke="currentColor" stroke-width="8" class="text-slate-700/60" fill="transparent" />
            <circle id="progress-circle" cx="88" cy="88" r="74" stroke="currentColor" stroke-width="8" class="text-emerald-500 transition-all duration-200" fill="transparent" stroke-dasharray="465" stroke-dashoffset="465" stroke-linecap="round" />
          </svg>

          <!-- Core Interactive Button -->
          <button id="counter-btn" onclick="incrementCurrent()" class="tap-effect absolute inset-3 rounded-full bg-gradient-to-tr from-emerald-800 to-teal-600 active:from-emerald-700 active:to-teal-500 flex flex-col items-center justify-center shadow-[0_0_25px_rgba(16,185,129,0.3)] border-2 border-emerald-400/40">
            <span id="current-counter-value" class="text-4xl font-extrabold text-white tracking-wider">0</span>
            <span class="text-[11px] text-emerald-200 mt-1 flex items-center gap-1">
              <i data-lucide="hand" class="w-3.5 h-3.5"></i> <span id="tap-to-count-text">اضغط للذكر</span>
            </span>
          </button>
        </div>

        <!-- Counter Controls (Reset, Sound toggle) -->
        <div class="w-full flex items-center justify-between pt-2 border-t border-slate-700/50 mt-3 px-2 text-xs">
          <button onclick="resetCurrentCounter()" class="flex items-center gap-1 text-slate-400 hover:text-rose-400 transition">
            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
            <span id="reset-text">تصفير</span>
          </button>
          
          <div class="flex items-center gap-3">
            <button id="vibrate-toggle" onclick="toggleVibrate()" class="text-emerald-400 hover:text-emerald-300">
              <i data-lucide="vibrate" class="w-4 h-4"></i>
            </button>
            <button id="sound-toggle" onclick="toggleSound()" class="text-emerald-400 hover:text-emerald-300">
              <i data-lucide="volume-2" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

      </div>

    <!-- Add New Dhikr Modal -->

                <option value="استغفار وتوبة">استغفار وتوبة</option>

    let currentLang = localStorage.getItem('app_lang') || 'ar';
    let azkar = JSON.parse(localStorage.getItem('azkar_list_app')) || defaultAzkarTranslations[currentLang];
    let selectedId = parseInt(localStorage.getItem('selected_dhikr_id')) || azkar[0].id;
    let soundEnabled = true;
    let vibrateEnabled = true;

    // Save to localStorage
    function saveState() {
      localStorage.setItem('azkar_list_app', JSON.stringify(azkar));
      localStorage.setItem('selected_dhikr_id', selectedId);
    }

    // Audio effect simulation using Web Audio API
    function playBeep(freq = 600, duration = 0.06) {
      if (!soundEnabled) return;
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.log(e);
      }
    }

        navigator.vibrate(35);
      }
    }

    function getCurrentDhikr() {
      return azkar.find(item => item.id === selectedId) || azkar[0];
    }

    function changeLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('app_lang', lang);
      
      // Update document direction
      if (lang === 'ar') {
        document.documentElement.dir = 'rtl';
        document.body.dir = 'rtl';
      } else {
        document.documentElement.dir = 'ltr';
        document.body.dir = 'ltr';
      }

      // Update select value
      document.getElementById('lang-select').value = lang;

      // Translate default items by ID to preserve counts
      azkar.forEach(item => {
        const defaultItem = defaultAzkarTranslations[lang].find(d => d.id === item.id);
        if (defaultItem) {
          item.text = defaultItem.text;
          item.virtue = defaultItem.virtue;
          item.category = defaultItem.category;
        }
      });

      saveState();
      translateUI();
      updateActiveDisplay();
    }

    function translateUI() {
      const t = i18n[currentLang];
      document.getElementById('app-title').innerText = t.title;
      document.getElementById('app-subtitle').innerText = t.subtitle;
      document.getElementById('add-btn-text').innerText = t.addBtn;
      document.getElementById('target-label-text').innerText = t.targetLabel;
      document.getElementById('tap-to-count-text').innerText = t.tapToCount;
      document.getElementById('reset-text').innerText = t.reset;
      document.getElementById('list-title-text').innerText = t.listTitle;
      document.getElementById('total-spins-label').innerText = t.totalSpins;
      
      document.getElementById('modal-title-text').innerText = t.modalTitle;
      document.getElementById('label-text-field').innerText = t.labelText;
      document.getElementById('label-virtue-field').innerText = t.labelVirtue;
      document.getElementById('label-target-field').innerText = t.labelTarget;
      document.getElementById('label-category-field').innerText = t.labelCategory;
      document.getElementById('btn-save-text').innerText = t.btnSave;
      document.getElementById('btn-cancel-text').innerText = t.btnCancel;
      
      document.getElementById('nav-my-azkar-text').innerText = t.myAzkar;
      document.getElementById('nav-add-text').innerText = t.addBtn;
      document.getElementById('nav-share-text').innerText = t.shareReward;

      // Placeholders
      document.getElementById('input-text').placeholder = t.placeholderText;
      document.getElementById('input-virtue').placeholder = t.placeholderVirtue;

      // Categories dropdown options
      const catSelect = document.getElementById('input-category');
      catSelect.options[0].text = t.categories.morningEvening;
      catSelect.options[1].text = t.categories.prayer;
      catSelect.options[2].text = t.categories.repentance;
      catSelect.options[3].text = t.categories.hadith;
      catSelect.options[4].text = t.categories.general;
    }

    function updateActiveDisplay() {
      const current = getCurrentDhikr();
      if (!current) return;

      document.getElementById('current-dhikr-text').innerText = current.text;
      document.getElementById('current-dhikr-virtue').innerText = current.virtue || (currentLang === 'ar' ? 'فضل وثواب الذكر عظيم عند الله تعالى' : 'The virtue and reward of remembrance is great');
      document.getElementById('current-category').innerText = current.category || 'ذكر مختار';
      document.getElementById('target-count').innerText = current.target;
      document.getElementById('current-counter-value').innerText = current.count;

      // Update Circle
      const progress = Math.min(current.count / current.target, 1);
      const circleCircumference = 465;
      const offset = circleCircumference - (progress * circleCircumference);
      document.getElementById('progress-circle').style.strokeDashoffset = offset;

      // Update badge and total
      document.getElementById('dhikr-badge-count').innerText = azkar.length;
      const totalSpins = azkar.reduce((acc, curr) => acc + curr.count, 0);
      document.getElementById('total-spins').innerText = totalSpins;

      renderList();
    }

    function incrementCurrent() {
      const current = getCurrentDhikr();
      if (!current) return;

      current.count += 1;
      triggerHaptic();

      // Check target reached
      if (current.count === current.target) {
        playBeep(880, 0.25);
        if (navigator.vibrate) navigator.vibrate([80, 50, 80]);
      } else {
        playBeep(520, 0.05);
      }

      saveState();
      updateActiveDisplay();
    }

    function resetCurrentCounter() {
      const current = getCurrentDhikr();
      if (!current) return;
      if (confirm(i18n[currentLang].confirmReset)) {
        current.count = 0;
        saveState();
        updateActiveDisplay();
      }
    }

    function selectDhikr(id) {
      selectedId = id;
      saveState();
      updateActiveDisplay();
      playBeep(450, 0.04);
    }

    function deleteDhikr(event, id) {
      event.stopPropagation();
      if (azkar.length <= 1) {
        alert(i18n[currentLang].alertMinDhikr);
        return;
      }
      if (confirm(i18n[currentLang].confirmDelete)) {
        azkar = azkar.filter(a => a.id !== id);
        if (selectedId === id) {
          selectedId = azkar[0].id;
        }
        saveState();
        updateActiveDisplay();
      }
    }

    function renderList() {
      const container = document.getElementById('dhikr-list');
      container.innerHTML = '';

      azkar.forEach(item => {
        const isSelected = item.id === selectedId;
        const div = document.createElement('div');
        div.className = `p-3 rounded-xl cursor-pointer transition border flex items-center justify-between gap-3 ${
          isSelected 
            ? 'bg-emerald-950/70 border-emerald-500 shadow-md ring-1 ring-emerald-500/40' 
            : 'bg-slate-800/70 border-slate-700/60 hover:bg-slate-800'
        }`;

        div.onclick = () => selectDhikr(item.id);

        const progressPercent = Math.min(Math.round((item.count / item.target) * 100), 100);

        div.innerHTML = `
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 mb-1">
              <span class="text-[10px] px-2 py-0.5 rounded bg-slate-900 border border-slate-700 text-emerald-400 font-medium">${item.category}</span>
              <span class="text-[10px] text-slate-400 font-semibold">${item.count} / ${item.target} (${progressPercent}%)</span>
            </div>
            <p class="text-xs font-quran text-slate-100 font-bold truncate leading-relaxed">${item.text}</p>
          </div>

          <div class="flex items-center gap-2">
            <button onclick="quickIncrement(event, ${item.id})" class="px-2.5 py-1 bg-emerald-700/50 hover:bg-emerald-600 active:scale-95 text-emerald-200 text-xs rounded-lg font-bold border border-emerald-500/30">
              +1
            </button>
            <button onclick="deleteDhikr(event, ${item.id})" class="p-1 text-slate-500 hover:text-rose-400 transition" title="حذف">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        `;

        container.appendChild(div);
      });

      lucide.createIcons();
    }

    function quickIncrement(event, id) {
      event.stopPropagation();
      const item = azkar.find(a => a.id === id);
      if (item) {
        item.count += 1;
        triggerHaptic();
        playBeep(520, 0.04);
        saveState();
        updateActiveDisplay();
      }
    }

    function handleAddNewDhikr(event) {
      event.preventDefault();
      const text = document.getElementById('input-text').value.trim();
      const virtue = document.getElementById('input-virtue').value.trim();
      const target = parseInt(document.getElementById('input-target').value) || 33;
      const category = document.getElementById('input-category').value;

      if (!text) return;

      const newDhikr = {
        id: Date.now(),
        text,
        virtue,
        category,
        count: 0,
        target
      };

      azkar.unshift(newDhikr);
      selectedId = newDhikr.id;
      saveState();
      updateActiveDisplay();
      closeModal();
      document.getElementById('add-dhikr-form').reset();
    }

    function openModal() {
      document.getElementById('add-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('add-modal').classList.add('hidden');
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('sound-toggle');
      btn.innerHTML = soundEnabled ? '<i data-lucide="volume-2" class="w-4 h-4"></i>' : '<i data-lucide="volume-x" class="w-4 h-4 text-slate-500"></i>';
      lucide.createIcons();
    }

    function toggleVibrate() {
      vibrateEnabled = !vibrateEnabled;
      const btn = document.getElementById('vibrate-toggle');
      btn.innerHTML = vibrateEnabled ? '<i data-lucide="vibrate" class="w-4 h-4 text-emerald-400"></i>' : '<i data-lucide="vibrate-off" class="w-4 h-4 text-slate-500"></i>';
      lucide.createIcons();
    }

    function shareAppSummary() {
      const total = azkar.reduce((a, b) => a + b.count, 0);
      const text = i18n[currentLang].shareText.replace('{total}', total);
      if (navigator.share) {
        navigator.share({ title: i18n[currentLang].title, text }).catch(() => {});
      } else {
        navigator.clipboard.writeText(text);
        alert(i18n[currentLang].copied);
      }
    }

    // Time ticker
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('current-time').innerText = `${hours}:${minutes}`;
    }

    // Initialization
    window.onload = () => {
      changeLanguage(currentLang);
      updateClock();
      setInterval(updateClock, 10000);
    };
  </script>
</body>
</html>
